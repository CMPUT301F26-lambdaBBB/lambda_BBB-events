name: Release

on:
  push:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "API_KEY=${{ secrets.GOOGLE_MAPS_TEST_KEY }}" >> code/local.properties

      - run: chmod +x code/gradlew

      - name: Tests
        run: ./code/gradlew -p code test

      - name: Build Release APK
        run: ./code/gradlew -p code assembleRelease

      - name: Generate Dokka Docs
        run: ./code/gradlew -p code dokkaGenerate
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: code/app/build/dokka/html

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          generate_release_notes: true
          files: |
            code/app/build/outputs/apk/release/*.apk

      - name: Deploy Docs
        uses: actions/deploy-pages@v4
