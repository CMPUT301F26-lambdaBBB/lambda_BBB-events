name: Release

on:
  push:
    branches: [main]

# Releases run one at a time and are never cancelled part way, so a release
# is not left created without its docs deployed
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_TEST_KEY }}" >> code/local.properties

      - run: chmod +x code/gradlew

      - name: Tests
        run: ./code/gradlew -p code test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: code/app/build/reports/tests/

      - name: Build Release APK
        run: ./code/gradlew -p code assembleRelease

      - name: Generate Dokka Docs
        run: ./code/gradlew -p code dokkaGenerate

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: code/app/build/dokka/html

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          generate_release_notes: true
          files: |
            code/app/build/outputs/apk/release/*.apk

      - name: Deploy Docs
        uses: actions/deploy-pages@v5
