name: Android CI/CD

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A new push to the same pull request replaces the run already in progress
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_TEST_KEY }}" >> code/local.properties

      - run: chmod +x code/gradlew

      - name: Tests
        run: ./code/gradlew -p code test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: code/app/build/reports/tests/

      - name: Build
        run: ./code/gradlew -p code assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: code/app/build/outputs/apk/debug/*.apk

  ui-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Create local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_TEST_KEY }}" >> code/local.properties

      - run: chmod +x code/gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: ./code/gradlew -p code connectedAndroidTest

      - name: Upload UI test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            code/app/build/reports/androidTests/
            code/app/build/outputs/androidTest-results/
